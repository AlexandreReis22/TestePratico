name: NoxLingo Android APK (isolado)
on:
  push:
    branches:
      - noxlingo-android-build
    paths:
      - 'noxlingo-android/**'
      - '.github/workflows/noxlingo-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noxlingo-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Preparar wrapper Android
        run: |
          cat > package.json <<'EOF'
          {
            "name": "noxlingo-android",
            "version": "0.1.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "app.noxlingo.mobile",
            "appName": "NoxLingo",
            "webDir": "www",
            "android": {
              "backgroundColor": "#090f1c"
            }
          }
          EOF
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Compilar APK debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: NoxLingo-Android-APK
          path: noxlingo-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
