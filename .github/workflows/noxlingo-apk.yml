name: NoxLingo Android APK (isolado)
on:
  push:
    branches:
      - noxlingo-android-build
    paths:
      - 'noxlingo-android/**'
      - '.github/workflows/noxlingo-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: noxlingo-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verificar Android SDK instalado no runner
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - name: Validar scripts e conteúdo da atualização
        run: |
          node -e "const fs=require('fs');const h=fs.readFileSync('www/index.html','utf8');const scripts=[...h.matchAll(/<script>([\\s\\S]*?)<\\/script>/g)];if(scripts.length!==2)throw Error('scripts ausentes');for(const m of scripts)new Function(m[1]);for(const t of ['AVALIADOR_V2_INICIO','30 aulas','function evaluateAnswer'])if(!h.includes(t))throw Error('conteudo ausente: '+t);console.log('NoxLingo v0.2 OK')"
      - name: Preparar wrapper Android
        run: |
          cat > package.json <<'EOF'
          {
            "name": "noxlingo-android",
            "version": "0.2.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "^7.0.0",
              "@capacitor/core": "^7.0.0"
            },
            "devDependencies": {
              "@capacitor/cli": "^7.0.0"
            }
          }
          EOF
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "app.noxlingo.mobile",
            "appName": "NoxLingo",
            "webDir": "www",
            "android": {
              "backgroundColor": "#090f1c"
            }
          }
          EOF
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
      - name: Atualizar versão interna Android
        run: |
          node -e "const fs=require('fs');const p='android/app/build.gradle';let s=fs.readFileSync(p,'utf8');if(!/versionCode\\s+\\d+/.test(s))throw Error('versionCode ausente');s=s.replace(/versionCode\\s+\\d+/,'versionCode 2').replace(/versionName\\s+[\x22\x27][^\x22\x27]+[\x22\x27]/,'versionName \\"0.2.0\\"');fs.writeFileSync(p,s);"
      - name: Compilar APK debug
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: Guardar APK para download
        uses: actions/upload-artifact@v4
        with:
          name: NoxLingo-v0.2-APK
          path: noxlingo-android/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
