  function challengeTitle(){return quiz.kind==='lesson'?`Aula ${String(quiz.lessonId).padStart(2,'0')} · ${LESSONS[quiz.lessonId-1].title}`:quiz.kind==='quick'?'Desafio de respostas rápidas':quiz.kind==='dialogue'?'Diálogos em espanhol':'Revisão de dificuldades';}
  function renderChallenge(){if(!quiz)return renderPractice();const q=quiz.items[quiz.position];if(!q)return '';const n=quiz.position+1;const pct=Math.round(quiz.position/quiz.items.length*100);return `<div class="challenge-layout"><button class="back-button" data-action="quit">${icon('back')} Sair deste treino</button><div class="challenge-header"><strong>${esc(challengeTitle())}</strong><span class="challenge-counter">Questão ${n} de ${quiz.items.length}</span></div><div class="progress-line"><div class="progress-fill" style="width:${pct}%"></div></div><section class="challenge-card"><span class="challenge-pill">${icon('bolt')} ${quiz.kind==='review'?'REVISÃO':'RESPONDA EM ESPANHOL'}</span><h2>${esc(q.prompt)}</h2><p class="prompt-tip">Escreva uma maneira natural de dizer isso em espanhol latino-americano.</p><label class="answer-label" for="answer-input">Sua resposta</label><textarea id="answer-input" class="answer-input" rows="2" ${quiz.answered?'readonly':''} autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Escreva aqui, sem precisar usar ¿ ou ¡...">${quiz.answered?esc(quiz.last.input):''}</textarea>${quiz.answered?renderFeedback(q):`<div class="challenge-actions"><div class="secondary-activity"><span class="quiet-btn" aria-label="Dica: ${esc(q.hint)}">${icon('light')} ${esc(q.lessonId?LESSONS[q.lessonId-1].focus:q.focus)}</span></div>${btn('Conferir resposta '+icon('arrow'),'check','btn-primary')}</div>`}</section><div class="hint-card">${icon('light')}<div><strong>Dica de estudo:</strong> não precisa escrever os sinais ¿ ou ¡. Se faltarem acentos, a resposta poderá ser aceita, mas o feedback destacará a grafia correta.</div></div></div>`;}
  function renderFeedback(q){const d=quiz.last;return `<section class="feedback ${d.correct?'':'wrong'}" aria-live="polite"><div class="feedback-title">${icon(d.correct?'check':'x')} ${d.correct?'Boa! Resposta aceita.':'Quase lá — veja uma resposta possível.'}</div><div class="feedback-answer">${esc(q.answers[0])}</div><p class="feedback-desc">${esc(q.hint)}${d.correct&&d.accentWords.length?' Confira os acentos em: '+esc(d.accentWords.join(', '))+'.':''}${!d.correct&&d.reviewWords.length?`<br>Pontos a revisar: <strong>${esc(d.reviewWords.join(' · '))}</strong>.`:''}</p><div class="feedback-options">${!d.correct?btn('Minha resposta também é válida','override','btn-outline'):btn(icon('speaker')+' Ouvir exemplo','speak-answer','btn-outline')}${btn(quiz.position===quiz.items.length-1?'Finalizar sessão '+icon('arrow'):'Próxima frase '+icon('arrow'),'next','btn-primary')}</div></section>`;}
  function differenceWords(input,correct){const actual=normalize(input).split(' ').filter(Boolean);const target=normalize(correct).split(' ').filter(Boolean);const available=actual.slice();const missing=[];for(const w of target){const idx=available.indexOf(w);if(idx>=0)available.splice(idx,1);else if(w.length>2&&!missing.includes(w))missing.push(w);}return missing.slice(0,5);}
  function checkAnswer(){if(!quiz||quiz.answered)return;const input=$('#answer-input')?.value.trim()||'';if(!input){showToast('Escreva sua resposta antes de conferir.');return;}const q=quiz.items[quiz.position];const matched=q.answers.find(a=>normalize(a)===normalize(input));const correct=!!matched;const accentWords=correct?accentWarnings(input,matched):[];const seconds=Math.max(1,Math.round((Date.now()-quiz.questionAt)/1000));const reviewWords=correct?[]:differenceWords(input,q.answers[0]);quiz.last={input,correct,seconds,reviewWords,accentWords};quiz.answered=true;quiz.results.push({id:q.id,correct,seconds});if(correct)quiz.correct++;store.stats.attempts++;store.stats.correct+=correct?1:0;store.stats.seconds+=seconds;store.history.unshift({qid:q.id,date:new Date().toISOString(),correct,seconds,kind:quiz.kind});store.history=store.history.slice(0,500);if(!store.mistakes[q.id])store.mistakes[q.id]={count:0,pending:0};if(correct){if(quiz.kind==='review')store.mistakes[q.id].pending=Math.max(0,store.mistakes[q.id].pending-1);}else{store.mistakes[q.id].count++;store.mistakes[q.id].pending++;for(const w of reviewWords)store.words[w]=(store.words[w]||0)+1;}save();render();}
  function overrideAnswer(){if(!quiz?.answered||quiz.last.correct)return;const q=quiz.items[quiz.position];quiz.last.correct=true;quiz.correct++;quiz.results[quiz.results.length-1].correct=true;store.stats.correct++;const m=store.mistakes[q.id];if(m){m.count=Math.max(0,m.count-1);m.pending=Math.max(0,m.pending-1);}for(const w of quiz.last.reviewWords){if(store.words[w])store.words[w]--;if(store.words[w]===0)delete store.words[w];}if(store.history[0]?.qid===q.id)store.history[0].correct=true;save();render();showToast('Resposta marcada como válida.');}
  function nextQuestion(){if(!quiz?.answered)return;if(quiz.position===quiz.items.length-1){finishQuiz();return;}quiz.position++;quiz.questionAt=Date.now();quiz.last=null;quiz.answered=false;render();if(window.innerWidth>740)$('#answer-input')?.focus();}
  function finishQuiz(){if(!quiz||quiz.done)return;quiz.done=true;const duration=Math.max(1,Math.round((Date.now()-quiz.started)/1000));quizDone={kind:quiz.kind,lessonId:quiz.lessonId,correct:quiz.correct,total:quiz.items.length,duration};if(quiz.kind==='lesson')store.completed[quiz.lessonId]=new Date().toISOString();store.stats.sessions++;store.sessions.unshift({...quizDone,date:new Date().toISOString()});store.sessions=store.sessions.slice(0,100);save();setView('end');}
  function renderEnd(){const r=quizDone;if(!r)return renderHome();const pct=Math.round(r.correct/r.total*100);return `<div class="challenge-layout"><section class="challenge-card end-screen"><div class="end-icon">${icon('check')}</div><h2>${r.kind==='lesson'?'Aula concluída!':'Treino concluído!'}</h2><p>${pct===100?'Todas as respostas foram aceitas. Excelente!':'Boa prática! O que faltou acertar entrou na revisão.'}</p><div class="end-metrics"><div class="metric"><div class="metric-value mint">${r.correct}/${r.total}</div><div class="metric-label">Acertos</div></div><div class="metric"><div class="metric-value violet">${pct}%</div><div class="metric-label">Resultado</div></div><div class="metric"><div class="metric-value orange">${r.duration}s</div><div class="metric-label">Duração</div></div></div><div class="end-actions">${btn(icon('refresh')+' Revisar erros','goto-review','btn-secondary')}${r.kind==='lesson'&&r.lessonId<30?btn('Próxima aula '+icon('arrow'),'lesson-'+(r.lessonId+1),'btn-primary'):btn('Voltar ao início '+icon('arrow'),'goto-home','btn-primary')}</div></section></div>`;}
  function speak(text){if(!('speechSynthesis'in window)){showToast('Este navegador não oferece voz em espanhol.');return;}try{window.speechSynthesis.cancel();const say=new SpeechSynthesisUtterance(text);const voices=window.speechSynthesis.getVoices();const voice=voices.find(v=>/^es-(MX|CO|AR|CL|PE|UY|VE)/i.test(v.lang))||voices.find(v=>/^es/i.test(v.lang));if(voice)say.voice=voice;say.lang=voice?.lang||'es-MX';say.rate=.83;window.speechSynthesis.speak(say);}catch{showToast('Não foi possível reproduzir o áudio neste aparelho.');}}
  function doExport(){const data=JSON.stringify({app:'NoxLingo',exportedAt:new Date().toISOString(),data:store},null,2);const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);const link=document.createElement('a');link.href=url;link.download=`NoxLingo_Backup_${dayKey(Date.now())}.json`;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);showToast('Backup preparado para download.');}
  function exportDiagnostics(){let logs=[];try{logs=JSON.parse(localStorage.getItem(ERROR_KEY)||'[]');}catch{}const blob=new Blob([JSON.stringify({app:'NoxLingo',version:'0.1',errors:logs},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='NoxLingo_Diagnostico.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);showToast('Diagnóstico preparado para download.');}
  function doReset(){if(!confirm('Apagar TODO o progresso e os favoritos deste aparelho? Esta ação não pode ser desfeita sem um backup.'))return;store=DEFAULT_DATA();save();setView('home');showToast('Progresso local apagado.');}
  async function importBackup(file){if(!file)return;try{if(file.size>5_000_000)throw new Error('Backup muito grande.');const obj=JSON.parse(await file.text());if(obj.app!=='NoxLingo'||!obj.data||obj.data.version!==1||!Array.isArray(obj.data.history)||!Array.isArray(obj.data.favorites)||typeof obj.data.completed!=='object'||obj.data.completed===null||typeof obj.data.mistakes!=='object'||obj.data.mistakes===null||typeof obj.data.stats!=='object'||obj.data.stats===null)throw new Error('Arquivo inválido ou incompatível.');if(!confirm('Substituir o progresso atual pelo progresso do backup selecionado?'))return;const source=obj.data;store={...DEFAULT_DATA(),...source,version:1,stats:{...DEFAULT_DATA().stats,...source.stats},favorites:source.favorites.filter(x=>typeof x==='string'),history:source.history.slice(0,500),sessions:Array.isArray(source.sessions)?source.sessions.slice(0,100):[],words:source.words&&typeof source.words==='object'&&!Array.isArray(source.words)?source.words:{}};save();setView('home');showToast('Backup restaurado.');}catch(e){showToast('Falha na importação: '+e.message);}finally{$('#backup-file').value='';}}
  function handleAction(action){if(action.startsWith('lesson-')){startLesson(Number(action.split('-')[1]));return;}switch(action){case'quick':startQuick();break;case'dialogue':startDialogue();break;case'review':startReview();break;case'check':checkAnswer();break;case'override':overrideAnswer();break;case'next':nextQuestion();break;case'quit':if(confirm('Sair do treino? As respostas já feitas ficam salvas, mas a aula não será marcada como concluída.')){quiz=null;setView('home');}break;case'speak-answer':if(quiz)speak(quiz.items[quiz.position].answers[0]);break;case'export':doExport();break;case'diagnostics':exportDiagnostics();break;case'import':$('#backup-file').click();break;case'reset':doReset();break;case'goto-lessons':setView('lessons');break;case'goto-home':setView('home');break;case'goto-review':setView('review');break;}}
  document.addEventListener('click',e=>{const a=e.target.closest('[data-action],[data-view],[data-filter],[data-category],[data-speak],[data-favorite]');if(!a)return;if(a.hasAttribute('data-view')){setView(a.dataset.view);return;}if(a.hasAttribute('data-action')){handleAction(a.dataset.action);return;}if(a.hasAttribute('data-filter')){lessonFilter=a.dataset.filter;render();return;}if(a.hasAttribute('data-category')){expressionCategory=a.dataset.category;render();return;}if(a.hasAttribute('data-speak')){const x=EXPRESSIONS.find(x=>x.id===a.dataset.speak);if(x)speak(x.es);return;}if(a.hasAttribute('data-favorite')){const id=a.dataset.favorite;store.favorites=store.favorites.includes(id)?store.favorites.filter(x=>x!==id):[...store.favorites,id];save();render();return;}});
  document.addEventListener('input',e=>{if(e.target.id==='expression-search'){expressionSearch=e.target.value;const results=EXPRESSIONS.filter(x=>(expressionCategory==='Todas'||(expressionCategory==='Favoritas'?store.favorites.includes(x.id):x.category===expressionCategory))&&normalize(x.es+' '+x.pt+' '+x.note).includes(normalize(expressionSearch)));$('#expression-results').innerHTML=expressionResults(results);}});
  document.addEventListener('keydown',e=>{if(e.target.id==='answer-input'&&e.key==='Enter'&&!e.shiftKey){e.preventDefault();checkAnswer();}if((e.target.classList.contains('brand'))&&(e.key==='Enter'||e.key===' ')){e.preventDefault();setView('home');}});
  $('#backup-file').addEventListener('change',e=>importBackup(e.target.files?.[0]));
  if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./service-worker.js').catch(()=>{});
  render();
})();

</script>
